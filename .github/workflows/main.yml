name: CI - Combined build and analysis workflow

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    analyze-and-build:
      name: Analyze (${{ matrix.language }})
      runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
      permissions:
        # required for all workflows
        security-events: write

        # required to fetch internal or private CodeQL packs
        packages: read

        # only required for workflows in private repositories
        actions: read
        contents: read

      strategy:
        fail-fast: true
        matrix:
          include:
          - language: actions
            build-mode: none
            config-file: ""
          - language: csharp
            build-mode: manual
            config-file: ./.github/codeql/codeql-config.yml
      steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config-file }}

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: matrix.language == 'csharp'
        run: dotnet restore codeql-demo/SyntheticMarker.csproj

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build codeql-demo/SyntheticMarker.csproj --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"